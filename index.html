<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starters 看图学习</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            margin: 0;
            padding: 10px;
            background: #f7f9fc;
            text-align: center;
        }
        .container {
            max-width: 420px;
            margin: auto;
        }
        h1 {
            font-size: 24px;
            color: #333;
        }
        .btn {
            display: block;
            width: 100%;
            margin: 8px 0;
            padding: 14px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn:active {
            background: #357abd;
        }
        .img-box {
            margin: 15px 0;
            position: relative;
            display: inline-block;
        }
        .img-box img {
            width: 220px;
            height: 220px;
            object-fit: contain;
            border-radius: 10px;
            background: #fff;
            padding: 5px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: 0.2s;
        }
        .img-box img:active {
            transform: scale(0.95);
        }
        .voice-hint {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 24px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            padding: 4px;
            pointer-events: none;
        }
        .word-display {
            font-size: 24px;
            letter-spacing: 4px;
            margin: 15px 0;
            min-height: 30px;
        }
        .letter-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 10px 0;
            min-height: 44px;
        }
        .letter-btn {
            width: 44px;
            height: 44px;
            font-size: 18px;
            background: #ffdf70;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .letter-btn:active {
            transform: scale(0.9);
        }
        .back-home {
            background: #999;
            margin-top: 10px;
        }
        .chapter-list {
            text-align: left;
        }
        .spell-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        .spell-controls .btn {
            margin: 0;
            flex: 1;
            padding: 12px 0;
            font-weight: bold;
        }
        .toast {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px 40px;
            border-radius: 12px;
            font-size: 24px;
            z-index: 9999;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>

    <div class="container" id="app">
        <div id="screen-home">
            <h1>🌟 Starters 看图学习</h1>
            <button class="btn" onclick="showChoiceMenu()">📸 看图选词</button>
            <button class="btn" onclick="showSpellMenu()">🔤 看图拼词</button>
            <button class="btn" onclick="startErrorReview()">📕 错题本</button>
            <div id="score" style="margin-top:20px;font-size:16px">分数：0</div>
        </div>

        <div id="screen-choice-menu" style="display:none">
            <h1>看图选词</h1>
            <button class="btn" onclick="startChoice('all')">全部随机</button>
            <button class="btn" onclick="showChoiceChapters()">按章节学习</button>
            <button class="btn back-home" onclick="showHome()">🏠 返回</button>
        </div>

        <div id="screen-spell-menu" style="display:none">
            <h1>看图拼词</h1>
            <button class="btn" onclick="startSpell('all')">全部随机</button>
            <button class="btn" onclick="showSpellChapters()">按章节学习</button>
            <button class="btn back-home" onclick="showHome()">🏠 返回</button>
        </div>

        <div id="screen-chapters" style="display:none">
            <h1>选择章节</h1>
            <div id="chapter-list"></div>
            <button class="btn back-home" onclick="showHome()">🏠 返回</button>
        </div>

        <div id="screen-game" style="display:none">
            <div class="img-box" onclick="playEnVoice(currentWord)" title="点击听发音">
                <img id="game-img" src="">
                <div class="voice-hint">🔊</div>
            </div>
            
            <div id="word-display" class="word-display"></div>
            <div id="options"></div>
            
            <div id="letters" class="letter-buttons"></div>
            <div id="spell-controls" class="spell-controls" style="display:none">
                <button class="btn" style="background:#ffb344" onclick="undoSpell()">↩️ 删除</button>
                <button class="btn" style="background:#ff7777" onclick="clearSpell()">🗑️ 清空</button>
                <button class="btn" style="background:#62d474" onclick="checkSpell()">✅ 确定</button>
            </div>
            
            <button class="btn" id="next-btn" onclick="nextQuestion()">🔄 下一题</button>
            <button class="btn back-home" onclick="showHome()">🏠 返回</button>
        </div>
    </div>

    <script>
        const WORD_BANKS = {
            "My body": ["face","eye","mouth","nose","ear","head","hair","leg","arm","hand","feet","foot"],
            "At the zoo": ["frog","mouse","sheep","tiger","duck","monkey","bird","cow","chicken","horse","lizard","goat","dog","hippo","giraffe","snake","crocodile","elephant","spider","zebra"],
            "At the clothes shop": ["glasses","hat","bag","clothes","handbag","jacket","sock","watch","trousers","shirt","dress","shoe","angry","jeans","T-shirt"],
            "At friend's birthday": ["alien","monster","balloon","baby","children","boy","girl","women","woman","men","man","people","robot","dad","mum","grandma","grandpa","sister","brother","cousin","family"],
            "My favourite food": ["fruit","rice","coconut","bread","onion","tomato","water","milk","dinner","fish","breakfast","watermelon","pineapple","cake","lunch","drink","candy","ice cream","chocolate","carrot","apple","banana","pear","peach","orange","cucumber","hamburger","sausage","lime","juice"],
            "At home": ["kitchen","bedroom","bathroom","house","flat","hall","cat","garden","mirror","bath","cupboard","clock","radio","box","bed","bookcase","painting","mat","television","lamp","armchair","sofa","window","door","chair"],
            "At school": ["draw","ruler","pencil","pen","eraser","page","part","football","classroom","basketball","school","music","tick","cross","open","close","computer","mouse","hockey"],
            "At the beach": ["baseball","walk","paint","fishing","piano","camera","jump","sand","tennis","swim","sun","shell","kite","guitar"],
            "My street": ["run","train","bookshop","shop","tree","park","motorbike","lorry","truck","bus","helicopter","bike","car","plane","stop"]
        };

        const SPELL_BANKS = {};
        for (let ch in WORD_BANKS) {
            SPELL_BANKS[ch] = WORD_BANKS[ch].filter(w => w.trim().split(" ").length === 1);
        }

        let allWords = [].concat(...Object.values(WORD_BANKS));
        let allSpellWords = [].concat(...Object.values(SPELL_BANKS));
        let score = 0;
        let currentWord = "";
        let userInput = [];
        let spellShuffleLetters = []; 
        let errorWords = JSON.parse(localStorage.getItem("errors") || "[]");
        let gameMode = "";
        let currentChapter = "";
        let isChoiceGame = true;
        let remainingPool = [];
        
        // 記錄當前題目的錯誤次數
        let wrongCount = 0;

        // ========== 語音播放系統 ==========
        let globalVoiceList = [];
        window.speechSynthesis.onvoiceschanged = function () {
            globalVoiceList = window.speechSynthesis.getVoices();
        };

        function playEnVoice(text) {
            if (!text || !window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = "en-GB";
            utter.rate = 0.8;
            const enVoice = globalVoiceList.find(v => v.lang.startsWith("en-GB"));
            if (enVoice) utter.voice = enVoice;
            window.speechSynthesis.speak(utter);
        }

        function playFeedbackVoice(isRight) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(isRight ? "你真叻！" : "再試一次吧！");
            utter.lang = "zh-HK";
            utter.rate = 0.98;
            const cantoneseVoice = globalVoiceList.find(v => v.lang.startsWith("zh-HK"));
            if (cantoneseVoice) utter.voice = cantoneseVoice;
            window.speechSynthesis.speak(utter);
        }

        function playCorrectAnswerVoice(answerStr, isSpell) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();

            const prefixUtter = new SpeechSynthesisUtterance("正確答案：");
            prefixUtter.lang = "zh-HK";
            prefixUtter.rate = 0.95;
            const cantoneseVoice = globalVoiceList.find(v => v.lang.startsWith("zh-HK"));
            if (cantoneseVoice) prefixUtter.voice = cantoneseVoice;

            prefixUtter.onend = () => {
                let answerUtterText = answerStr;
                // 拼寫模式將字母拆開念 (例如: h, a, n, d)
                if (isSpell) {
                    answerUtterText = answerStr.split('').join(', ');
                }

                const answerUtter = new SpeechSynthesisUtterance(answerUtterText);
                answerUtter.lang = "en-GB";
                answerUtter.rate = isSpell ? 0.65 : 0.8; // 拼寫放慢速度
                const targetVoice = globalVoiceList.find(v => v.lang.startsWith("en-GB"));
                if (targetVoice) answerUtter.voice = targetVoice;

                window.speechSynthesis.speak(answerUtter);
            };
            window.speechSynthesis.speak(prefixUtter);
        }

        // ========== 彈窗與畫面控制 ==========
        function showToast(msg, duration = 1500, callback = null) {
            let t = document.getElementById("toast");
            t.innerText = msg;
            t.style.display = "block";
            setTimeout(() => {
                t.style.display = "none";
                if(callback) callback();
            }, duration);
        }

        function showAnswerModal(answer, nextFunc) {
            const modal = document.createElement("div");
            modal.style.position = "fixed";
            modal.style.left = "0"; modal.style.top = "0";
            modal.style.width = "100vw"; modal.style.height = "100vh";
            modal.style.background = "rgba(0,0,0,0.5)";
            modal.style.display = "flex"; modal.style.justifyContent = "center"; modal.style.alignItems = "center";
            modal.style.zIndex = "9999";

            const box = document.createElement("div");
            box.style.background = "#fffef8";
            box.style.padding = "40px 25px";
            box.style.borderRadius = "24px";
            box.style.textAlign = "center";
            box.style.boxShadow = "0 5px 20px rgba(0,0,0,0.1)";

            const text = document.createElement("p");
            text.style.fontSize = "28px";
            text.style.color = "#f03030";
            text.style.fontWeight = "bold";
            text.innerText = `正确答案：${answer}`;

            const confirmBtn = document.createElement("button");
            confirmBtn.className = "btn";
            confirmBtn.style.background = "#62d474";
            confirmBtn.style.maxWidth = "200px";
            confirmBtn.style.margin = "20px auto 0";
            confirmBtn.innerText = "确认";
            confirmBtn.onclick = () => {
                document.body.removeChild(modal);
                nextFunc();
            };

            box.appendChild(text); box.appendChild(confirmBtn);
            modal.appendChild(box); document.body.appendChild(modal);
        }

        function showHome() {
            document.querySelectorAll("#app > div").forEach(s => s.style.display = "none");
            document.getElementById("screen-home").style.display = "block";
            document.getElementById("score").innerText = "分数：" + score;
        }

        function showChoiceMenu() {
            document.querySelectorAll("#app > div").forEach(s => s.style.display = "none");
            document.getElementById("screen-choice-menu").style.display = "block";
        }

        function showSpellMenu() {
            document.querySelectorAll("#app > div").forEach(s => s.style.display = "none");
            document.getElementById("screen-spell-menu").style.display = "block";
        }

        function getImageSrc(word) {
            if (word === "chicken") return "images/chicken.png";
            if (word === "mouse") return "images/mouse.png";
            return "images/" + word + ".jpg";
        }

        function saveErrors() {
            localStorage.setItem("errors", JSON.stringify(errorWords));
        }

        function showChoiceChapters() { renderChapters("choice"); }
        function showSpellChapters() { renderChapters("spell"); }

        function renderChapters(type) {
            let list = document.getElementById("chapter-list");
            list.innerHTML = "";
            for (let ch in WORD_BANKS) {
                let btn = document.createElement("button");
                btn.className = "btn";
                btn.innerText = ch;
                btn.onclick = () => {
                    if (type === "choice") startChoice("chapter", ch);
                    else startSpell("chapter", ch);
                };
                list.appendChild(btn);
            }
            document.querySelectorAll("#app > div").forEach(s => s.style.display = "none");
            document.getElementById("screen-chapters").style.display = "block";
        }

        function initPool() {
            let base = [];
            if (isChoiceGame) {
                if (gameMode === "all") base = [...allWords];
                else if (gameMode === "chapter") base = [...WORD_BANKS[currentChapter]];
                else if (gameMode === "error") base = [...errorWords];
            } else {
                if (gameMode === "all") base = [...allSpellWords];
                else if (gameMode === "chapter") base = [...(SPELL_BANKS[currentChapter] || [])];
                else if(gameMode === "error") base = [...errorWords.filter(w=>!w.includes(" "))];
            }
            remainingPool = base.sort(() => Math.random() - 0.5);
        }

        function startChoice(mode, chapter = null) {
            gameMode = mode; currentChapter = chapter; isChoiceGame = true;
            initPool(); nextQuestion();
        }

        function startErrorReview() {
            if (errorWords.length === 0) {
                showToast("错题本为空！"); return;
            }
            gameMode = "error"; isChoiceGame = true;
            initPool(); nextQuestion();
        }

        function nextQuestion() {
            if (remainingPool.length === 0) {
                alert("🎉 本轮所有题目已完成！返回主页可重新开始。");
                showHome(); return;
            }
            currentWord = remainingPool.shift();
            userInput = [];
            wrongCount = 0; // 重置該題錯誤次數
            
            if (!isChoiceGame) {
                spellShuffleLetters = currentWord.split("").sort(() => Math.random() - 0.5);
            }

            document.getElementById("game-img").src = getImageSrc(currentWord);
            document.querySelectorAll("#app > div").forEach(s => s.style.display = "none");
            document.getElementById("screen-game").style.display = "block";
            
            playEnVoice(currentWord);

            if (isChoiceGame) renderChoice();
            else renderSpell();
        }

        function renderChoice() {
            document.getElementById("word-display").style.display = "none";
            document.getElementById("letters").style.display = "none";
            document.getElementById("spell-controls").style.display = "none";
            document.getElementById("next-btn").style.display = "block"; 
            
            let pool = allWords;
            let opts = [currentWord];
            while (opts.length < 4) {
                let w = pool[Math.floor(Math.random() * pool.length)];
                if (!opts.includes(w)) opts.push(w);
            }
            opts.sort(() => Math.random() - 0.5);
            
            let box = document.getElementById("options");
            box.innerHTML = "";
            opts.forEach(o => {
                let b = document.createElement("button");
                b.className = "btn";
                b.innerText = o;
                b.onclick = () => checkChoiceAnswer(o);
                box.appendChild(b);
            });
        }

        // ========== 選詞判斷邏輯 (最多2次) ==========
        function checkChoiceAnswer(sel) {
            if (sel === currentWord) {
                playFeedbackVoice(true); 
                showToast("✅ 正确！", 1200, () => {
                    score++;
                    if(gameMode === "error"){
                        let idx = errorWords.indexOf(currentWord);
                        if(idx>-1){
                            errorWords.splice(idx,1);
                            saveErrors();
                        }
                    }
                    nextQuestion();
                });
            } else {
                wrongCount++;
                if (wrongCount >= 2) {
                    if(gameMode !== "error" && !errorWords.includes(currentWord)){
                        errorWords.push(currentWord);
                        saveErrors();
                    }
                    playCorrectAnswerVoice(currentWord, false);
                    showAnswerModal(currentWord, () => {
                        nextQuestion();
                    });
                } else {
                    playFeedbackVoice(false);
                    showToast("❌ 错误，再试一次！", 1500);
                    if(gameMode !== "error" && !errorWords.includes(currentWord)){
                        errorWords.push(currentWord);
                        saveErrors();
                    }
                }
            }
        }

        function startSpell(mode, chapter = null) {
            gameMode = mode; currentChapter = chapter; isChoiceGame = false;
            initPool(); nextQuestion();
        }

        function renderSpell() {
            document.getElementById("options").innerHTML = "";
            document.getElementById("word-display").style.display = "block";
            document.getElementById("letters").style.display = "flex";
            document.getElementById("spell-controls").style.display = "flex"; 
            document.getElementById("next-btn").style.display = "none";     
            
            updateWordDisplay();
            
            let tempUsed = [...userInput];
            let remainLetters = [];
            spellShuffleLetters.forEach(ch => {
                let idx = tempUsed.indexOf(ch);
                if (idx === -1) {
                    remainLetters.push(ch); 
                } else {
                    tempUsed.splice(idx, 1); 
                }
            });

            let letterBox = document.getElementById("letters");
            letterBox.innerHTML = "";
            remainLetters.forEach(c => {
                let btn = document.createElement("button");
                btn.className = "letter-btn";
                btn.innerText = c;
                btn.onclick = () => {
                    if (userInput.length < currentWord.length) {
                        userInput.push(c);
                        renderSpell(); 
                    }
                };
                letterBox.appendChild(btn);
            });
        }

        function updateWordDisplay() {
            let display = document.getElementById("word-display");
            let txt = [];
            for (let i = 0; i < currentWord.length; i++) {
                txt.push(userInput[i] || "_");
            }
            display.innerText = txt.join("  ");
        }

        function undoSpell() {
            if (userInput.length > 0) {
                userInput.pop();
                renderSpell();
            }
        }

        function clearSpell() {
            userInput = [];
            renderSpell();
        }

        // ========== 拼寫判斷邏輯 (最多2次) ==========
        function checkSpell() {
            if (userInput.join("") === currentWord) {
                playFeedbackVoice(true); 
                showToast("✅ 拼写正确！", 1200, () => {
                    score++;
                    if(gameMode === "error"){
                        let idx = errorWords.indexOf(currentWord);
                        if(idx>-1){
                            errorWords.splice(idx,1);
                            saveErrors();
                        }
                    }
                    nextQuestion();
                });
            } else {
                wrongCount++;
                if (wrongCount >= 2) {
                    if(gameMode !== "error" && !errorWords.includes(currentWord)){
                        errorWords.push(currentWord);
                        saveErrors();
                    }
                    playCorrectAnswerVoice(currentWord, true);
                    showAnswerModal(currentWord, () => {
                        nextQuestion();
                    });
                } else {
                    playFeedbackVoice(false); 
                    showToast("❌ 拼写错误，再试一次！", 1500);
                    if(gameMode !== "error" && !errorWords.includes(currentWord)){
                        errorWords.push(currentWord);
                        saveErrors();
                    }
                    clearSpell(); 
                }
            }
        }

        showHome();
    </script>
</body>
</html>
